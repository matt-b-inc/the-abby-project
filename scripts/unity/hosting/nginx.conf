server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    absolute_redirect off;

    # Build-Camp uses an uncompressed export. Compress on the server instead,
    # so the loader and browser always agree about the content encoding.
    gzip on;
    gzip_vary on;
    gzip_types application/wasm application/javascript application/octet-stream;

    # Filenames may be reused in the next export. Revalidate the entire build.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /play {
        return 308 /play/;
    }

    location ~ ^/play/.*\.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location /play/ {
        try_files $uri $uri/ =404;
    }

    # The existing Coolify application owns /api, login, React, and all other
    # routes. Never substitute Unity's index for a missing runtime file.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }
}
