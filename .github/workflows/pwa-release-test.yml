name: PWA release and offline verification

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/pwa-release-test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/pwa-release-test.yml'
  workflow_dispatch:

jobs:
  pwa-release-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify release replacement and offline behavior
        working-directory: frontend
        run: npm run test:pwa
      - name: Save browser failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-browser-failure
          path: frontend/test-results/
          retention-days: 7
